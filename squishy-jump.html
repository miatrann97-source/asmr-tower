<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASMR Squishy Tower Jump</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body {
    background: linear-gradient(180deg, #ffdee9 0%, #b5fffc 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }
  #gameContainer {
    position: relative;
    width: 400px;
    height: 700px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    overflow: hidden;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(10px);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    color: #5a4a66;
    font-weight: bold;
  }
  .score-box {
    background: rgba(255, 255, 255, 0.7);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(255, 255, 255, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }
  h1 { color: #ff6b9d; font-size: 32px; margin-bottom: 10px; text-shadow: 2px 2px 0px #fff; }
  p { color: #666; margin-bottom: 25px; font-size: 15px; line-height: 1.5; }
  button {
    background: linear-gradient(45deg, #ff758c 0%, #ff7eb3 100%);
    border: none;
    color: white;
    padding: 15px 40px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
    transition: transform 0.2s;
  }
  button:hover { transform: scale(1.05); }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="gameContainer">
  <div id="ui">
    <div class="score-box">Điểm: <span id="score">0</span></div>
    <div class="score-box">Kỷ lục: <span id="bestScore">0</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="700"></canvas>
  <div id="overlay">
    <h1>Squishy Jump</h1>
    <p>Kéo chuột trái/phải (hoặc dùng phím mũi tên) để xoay tháp.<br>Tránh các bệ màu đỏ gai góc và tận hưởng âm thanh ASMR!</p>
    <button id="startBtn">CHƠI NGAY</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('score');
const bestScoreEl = document.getElementById('bestScore');

// Khởi tạo Web Audio API cho âm thanh ASMR
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSquishSound(combo = 1) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';

  // Cao độ tăng dần theo combo
  const baseFreq = 220 + Math.min(combo * 35, 400);
  osc.frequency.setValueAtTime(baseFreq * 0.7, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.4, audioCtx.currentTime + 0.08);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.8, audioCtx.currentTime + 0.2);

  gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.23);
}

function playSmashSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);

  gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.3);
}

// Biến trạng thái game
let isPlaying = false;
let score = 0;
let bestScore = localStorage.getItem('squishyBest') || 0;
bestScoreEl.textContent = bestScore;

let towerAngle = 0;
let isDragging = false;
let lastMouseX = 0;
let cameraY = 0;
let combo = 0;

// Nhân vật Squishy
const player = {
  x: 200,
  y: 150,
  radius: 22,
  vy: 0,
  gravity: 0.45,
  jumpForce: -10.5,
  scaleX: 1,
  scaleY: 1,
  color: '#ff7eb3',
  isSuper: false
};

let platforms = [];
let particles = [];
const PLATFORM_GAP = 140;
const TOWER_RADIUS = 130;

function createPlatform(index) {
  const y = 300 + index * PLATFORM_GAP;
  // Tạo các mảnh bệ (gồm an toàn, nguy hiểm và khe hở)
  const segments = [];
  const totalSlices = 12;
  const sliceAngle = (Math.PI * 2) / totalSlices;

  // Đảm bảo luôn có ít nhất 2-3 khe hở liên tiếp
  const gapStart = Math.floor(Math.random() * totalSlices);
  const gapSize = index === 0 ? 3 : (Math.random() > 0.5 ? 3 : 2);

  for (let i = 0; i < totalSlices; i++) {
    let isGap = false;
    for (let g = 0; g < gapSize; g++) {
      if ((gapStart + g) % totalSlices === i) isGap = true;
    }
    if (isGap) continue;

    // Tầng đầu tiên không có bệ đỏ
    const isDanger = index > 1 && Math.random() < 0.22;
    segments.push({
      startAngle: i * sliceAngle,
      endAngle: (i + 1) * sliceAngle,
      type: isDanger ? 'danger' : 'safe',
      splashes: [] // Lưu các vệt sơn ASMR
    });
  }

  return { y, segments, passed: false, broken: false };
}

function initGame() {
  score = 0;
  scoreEl.textContent = score;
  combo = 0;
  towerAngle = 0;
  cameraY = 0;
  player.y = 150;
  player.vy = 0;
  player.scaleX = 1;
  player.scaleY = 1;
  player.isSuper = false;
  platforms = [];
  particles = [];

  for (let i = 0; i < 15; i++) {
    platforms.push(createPlatform(i));
  }
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      radius: 3 + Math.random() * 5,
      color,
      life: 1
    });
  }
}

// Điều khiển chuột & cảm ứng
canvas.addEventListener('mousedown', e => { isDragging = true; lastMouseX = e.clientX; });
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', e => {
  if (!isDragging || !isPlaying) return;
  const dx = e.clientX - lastMouseX;
  towerAngle += dx * 0.012;
  lastMouseX = e.clientX;
});

canvas.addEventListener('touchstart', e => { isDragging = true; lastMouseX = e.touches[0].clientX; });
window.addEventListener('touchend', () => { isDragging = false; });
window.addEventListener('touchmove', e => {
  if (!isDragging || !isPlaying) return;
  const dx = e.touches[0].clientX - lastMouseX;
  towerAngle += dx * 0.015;
  lastMouseX = e.touches[0].clientX;
});

// Điều khiển bàn phím
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function normalizeAngle(a) {
  a = a % (Math.PI * 2);
  return a < 0 ? a + Math.PI * 2 : a;
}

function update() {
  if (!isPlaying) return;

  if (keys['ArrowLeft'] || keys['a']) towerAngle -= 0.05;
  if (keys['ArrowRight'] || keys['d']) towerAngle += 0.05;

  // Vật lý rơi của Squishy
  player.vy += player.gravity;
  if (player.vy > 14) player.vy = 14;
  player.y += player.vy;

  // Hiệu ứng biến dạng (Squash & Stretch) theo vận tốc
  const stretch = Math.min(Math.abs(player.vy) * 0.025, 0.35);
  if (player.vy > 0) {
    player.scaleX += (1 - stretch * 0.6 - player.scaleX) * 0.2;
    player.scaleY += (1 + stretch - player.scaleY) * 0.2;
  } else {
    player.scaleX += (1 - stretch * 0.5 - player.scaleX) * 0.2;
    player.scaleY += (1 + stretch * 0.8 - player.scaleY) * 0.2;
  }

  // Camera đuổi theo nhân vật mượt mà
  if (player.y - cameraY > 250) {
    cameraY += (player.y - 250 - cameraY) * 0.15;
  }

  // Góc phía trước trục tháp nơi nhân vật đang ở (góc PI/2 là hướng thẳng về phía người nhìn)
  const frontAngle = normalizeAngle(Math.PI / 2 - towerAngle);

  // Kiểm tra va chạm với các tầng tháp
  platforms.forEach((plat, idx) => {
    if (plat.broken) return;

    // Tính điểm khi rơi qua tầng
    if (!plat.passed && player.y > plat.y) {
      plat.passed = true;
      combo++;
      score += 10 * combo;
      scoreEl.textContent = score;
      if (combo >= 3) player.isSuper = true;

      // Tạo thêm tầng mới bên dưới
      platforms.push(createPlatform(platforms.length));
    }

    // Va chạm khi đang rơi xuống
    if (player.vy > 0 && player.y + player.radius * player.scaleY >= plat.y - 8 && player.y - player.radius <= plat.y + 8) {
      // Kiểm tra xem tại frontAngle có bệ đỡ không
      let hitSegment = null;
      for (let seg of plat.segments) {
        if (frontAngle >= seg.startAngle && frontAngle <= seg.endAngle) {
          hitSegment = seg;
          break;
        }
      }

      if (hitSegment) {
        // Nếu đang ở trạng thái Super (rơi qua >= 3 tầng), đập vỡ bệ!
        if (player.isSuper) {
          plat.broken = true;
          player.isSuper = false;
          combo = 0;
          player.vy = player.jumpForce * 0.9;
          player.scaleX = 1.6;
          player.scaleY = 0.5;
          playSmashSound();
          spawnParticles(player.x, plat.y, '#ffbe0b', 25);
          return;
        }

        if (hitSegment.type === 'danger') {
          gameOver();
          return;
        }
        // Nảy lên bình thường
        player.y = plat.y - 8 - player.radius * 0.6;
        player.vy = player.jumpForce;
        // Bẹp dí xuống cực mạnh (Squash)
        player.scaleX = 1.65;
        player.scaleY = 0.45;
        // In vệt sơn ASMR lên bệ
        hitSegment.splashes.push(frontAngle);
        playSquishSound(combo);
        spawnParticles(player.x, plat.y - 8, player.color, 10);
        combo = 0;
      }
    }
  });
  // Cập nhật hạt hiệu ứng
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function gameOver() {
  isPlaying = false;
  playSmashSound();
  spawnParticles(player.x, player.y, '#ff4d6d', 30);
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('squishyBest', bestScore);
    bestScoreEl.textContent = bestScore;
  }
  overlay.innerHTML = `<h1>Hết lượt!</h1> <p>Điểm của bạn: <b>${score}</b><br>Kỷ lục: <b>${bestScore}</b></p> <button onclick="startGame()">CHƠI LẠI</button>`;
  overlay.style.display = 'flex';
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(0, -cameraY);
  // Vẽ lõi trụ tháp ở giữa
  const pillarGrad = ctx.createLinearGradient(165, 0, 235, 0);
  pillarGrad.addColorStop(0, '#e0c3fc');
  pillarGrad.addColorStop(0.5, '#ffffff');
  pillarGrad.addColorStop(1, '#8ec5fc');
  ctx.fillStyle = pillarGrad;
  ctx.fillRect(165, cameraY, 70, canvas.height);
  // Vẽ các tầng tháp
  platforms.forEach(plat => {
    if (plat.broken || plat.y < cameraY - 50 || plat.y > cameraY + canvas.height + 50) return;
    plat.segments.forEach(seg => {
      // Tính tọa độ 2D giả lập 3D dựa trên góc xoay
      const a1 = seg.startAngle + towerAngle;
      const a2 = seg.endAngle + towerAngle;
      // Chỉ vẽ phần mặt trước hoặc vẽ cả vòng tròn dẹt (hình elip)
      const x1 = 200 + Math.cos(a1) * TOWER_RADIUS;
      const y1 = plat.y + Math.sin(a1) * 32;
      const x2 = 200 + Math.cos(a2) * TOWER_RADIUS;
      const y2 = plat.y + Math.sin(a2) * 32;
      ctx.beginPath();
      ctx.moveTo(200, plat.y);
      ctx.lineTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.closePath();
      // Màu sắc phân biệt mặt trước/sau để tạo chiều sâu 3D
      const isFront = Math.sin((a1 + a2) / 2) > 0;
      if (seg.type === 'danger') {
        ctx.fillStyle = isFront ? '#ff4d6d' : '#c9184a';
      } else {
        ctx.fillStyle = isFront ? '#a0c4ff' : '#bdb2ff';
      }
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Vẽ vệt sơn ASMR trên bệ
      seg.splashes.forEach(splashAngle => {
        const sa = splashAngle + towerAngle;
        const sx = 200 + Math.cos(sa) * (TOWER_RADIUS * 0.72);
        const sy = plat.y + Math.sin(sa) * 22;
        ctx.fillStyle = '#ff7eb3';
        ctx.beginPath();
        ctx.ellipse(sx, sy, 14, 5, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    });
  });
  // Vẽ nhân vật Squishy (với hiệu ứng Squash & Stretch)
  const frontY = player.y + 22; // Vị trí tiếp xúc ở mặt trước elip
  ctx.save();
  ctx.translate(player.x, frontY);
  ctx.scale(player.scaleX, player.scaleY);
  // Thân Squishy
  ctx.beginPath();
  ctx.arc(0, -player.radius, player.radius, 0, Math.PI * 2);
  ctx.fillStyle = player.isSuper ? '#ffbe0b' : player.color;
  ctx.shadowColor = player.isSuper ? '#ffbe0b' : 'rgba(255, 126, 179, 0.5)';
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;
  // Điểm sáng bóng bẩy trên bề mặt
  ctx.beginPath();
  ctx.ellipse(-7, -player.radius - 8, 6, 3, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.fill();
  // Khuôn mặt dễ thương
  ctx.fillStyle = '#4a3b47';
  // Mắt
  ctx.beginPath();
  ctx.arc(-7, -player.radius + 2, 2.5, 0, Math.PI * 2);
  ctx.arc(7, -player.radius + 2, 2.5, 0, Math.PI * 2);
  ctx.fill();
  // Má hồng
  ctx.fillStyle = 'rgba(255, 77, 109, 0.4)';
  ctx.beginPath();
  ctx.arc(-11, -player.radius + 6, 3.5, 0, Math.PI * 2);
  ctx.arc(11, -player.radius + 6, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // Vẽ các hạt lấp lánh
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  initAudio();
  initGame();
  overlay.style.display = 'none';
  isPlaying = true;
}

startBtn.addEventListener('click', startGame);
loop();
</script>
</body>
</html>
